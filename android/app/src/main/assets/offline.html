<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JETSTREAM — Grounded</title>
<style>
  html, body { height: 100%; margin: 0; background: #070b12; color: #eef1f5; font-family: -apple-system, Roboto, "Inter", system-ui, sans-serif; }
  .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 28px; box-sizing: border-box; }
  .ring { width: 120px; height: 120px; border-radius: 50%; border: 1px solid rgba(34,211,238,0.35); display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 28px; }
  .ring:before { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 1px dashed rgba(255,255,255,0.10); }
  .ring svg { width: 54px; height: 54px; filter: drop-shadow(0 0 16px rgba(34,211,238,0.6)); }
  .eyebrow { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 11px; letter-spacing: 0.3em; color: #22d3ee; margin-bottom: 10px; }
  h1 { font-family: Georgia, "Fraunces", serif; font-weight: 500; font-size: 30px; line-height: 1.1; margin: 0 0 10px; }
  p { color: #8b93a1; font-size: 14px; line-height: 1.5; max-width: 320px; margin: 0 0 26px; }
  .reason { font-family: ui-monospace, monospace; font-size: 11px; color: #5a5f64; margin-top: 16px; }
  button { appearance: none; border: 0; background: #22d3ee; color: #041016; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; padding: 14px 26px; border-radius: 12px; }
  button:active { transform: scale(0.98); }
</style>
</head>
<body>
<div class="wrap">
  <div class="ring">
    <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" fill="#fff"/></svg>
  </div>
  <div class="eyebrow">GROUNDED</div>
  <h1>No connection to the tower.</h1>
  <p>Your flights keep moving in real time. Reconnect and we’ll pick up exactly where the sim left off.</p>
  <button onclick="retry()">Try again</button>
  <div class="reason" id="reason"></div>
</div>
<script>
  var r = decodeURIComponent((location.hash || '').slice(1));
  if (r) document.getElementById('reason').textContent = r;
  function retry() {
    if (window.JetstreamNative && JetstreamNative.reload) JetstreamNative.reload();
    else location.href = 'https://private-jet-sim.vercel.app/';
  }
</script>
</body>
</html>
